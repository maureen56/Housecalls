<div id="home" class="max-w-5xl mx-auto p-2"><div id="roleBanner" class="bg-white rounded-xl p-3 border mb-2 text-xs hidden"></div><div class="bg-white rounded-xl p-2 flex justify-between text-xs border"><b>🏠 Public Home - Click Tech to see Works + Salary + Experience</b><button onclick="getGPS()" class="bg-purple-600 text-white px-3 py-1 rounded-full"><span id="locLab">📍 GPS</span></button></div><div id="publicReviews" class="bg-white rounded-xl p-3 border mt-2"><b class="text-xs">⭐ Public Reviews Wall</b><div id="reviewsWall" class="mt-2 space-y-2 max-h-60 overflow-y-auto"></div></div><div id="empty" class="bg-white rounded-xl p-6 text-center mt-2 border"><h3 class="font-bold text-sm">No techs yet - Create Tech with salary + experience</h3></div><div id="grid" class="grid md:grid-cols-2 gap-2 mt-2"></div></div>

<div id="admin" class="hidden max-w-4xl mx-auto p-2"><div id="aLogin" class="bg-white rounded-xl p-6 max-w-sm mx-auto mt-10 text-center border shadow"><h2 class="font-bold text-sm">Admin Login</h2><div class="relative mt-3"><input id="aPass" type="password" placeholder="Enter Admin Password" class="w-full p-3 border rounded-xl text-sm pr-10"><button onclick="toggleEye()" class="absolute right-3 top-3 text-gray-400"><i id="eye" class="fas fa-eye"></i></button></div><button onclick="doAdminLogin()" class="w-full bg-black text-white py-3 rounded-xl mt-3 font-bold text-sm">Login</button></div><div id="aPanel" class="hidden space-y-2"><div class="bg-white p-3 rounded-xl flex justify-between border"><b class="text-[11px]">Admin Dashboard</b><button onclick="aLogout()" class="text-[10px] bg-gray-100 px-3 py-1 rounded-full">Logout</button></div><div class="bg-white p-3 rounded-xl border"><b class="text-xs">Pending Techs</b><div id="aPend" class="mt-2 space-y-2"></div></div><div class="bg-white p-3 rounded-xl border"><b class="text-xs">Approved Public Profiles</b><div id="aAppr" class="mt-2 space-y-2"></div></div><div class="bg-white p-3 rounded-xl border"><b class="text-xs">⭐ Reviews</b><div id="aReviews" class="mt-2"></div></div></div></div>
<script>
const ADMIN="EldoretAdmin2026!"; let rec=null; let curRevEmail=''; let curStars=0; let lastChatCount=0; let lastTechCount=0; let myMap=null; let myLat=0.5143; let myLng=35.2697;
function showTab(t){
 let active=localStorage.getItem('activeRole');
 let isTech=active==='tech' && JSON.parse(localStorage.getItem('myTechV36')||'null');
 let isClient=active==='client' && JSON.parse(localStorage.getItem('myClient')||'null');
 if(t==='client' && isTech){ toast('You are TECH - Logout first','err'); return; }
 if(t==='profile' && isClient){ toast('You are CLIENT - Logout first','err'); return; }
 ['home','chat','profile','client','mapTab','admin'].forEach(x=>{
  let el=document.getElementById(x); if(el) el.classList.add('hidden');
  let bId = x==='client'? 'bcl' : x==='mapTab'? 'bm' : 'b'+x[0];
  let b=document.getElementById(bId); if(b) b.className='bg-white/20 px-2 py-1 rounded-full';
 });
 let cur=document.getElementById(t); if(cur) cur.classList.remove('hidden');
 let id = t==='client'? 'bcl' : t==='mapTab'? 'bm' : 'b'+t[0];
 let ab=document.getElementById(id); if(ab) ab.className='bg-white text-pink-600 px-2 py-1 rounded-full font-bold';
 if(t==='home') renderHome(); if(t==='chat') renderChat(); if(t==='profile') renderTechTab(); if(t==='client') renderClientTab(); if(t==='mapTab') initMap(); if(t==='admin') checkAdmin(); updateRoleBanner();
}
function toB64(inp,imgId,key){ let f=inp.files[0]; if(!f) return; let r=new FileReader(); r.onload=e=>{ document.getElementById(imgId).src=e.target.result; localStorage.setItem(key,e.target.result); }; r.readAsDataURL(f); }
function toggleEye(){ let p=document.getElementById('aPass'); let e=document.getElementById('eye'); if(p.type==='password'){ p.type='text'; e.className='fas fa-eye-slash'; } else { p.type='password'; e.className='fas fa-eye'; } }
function getMe(){ let active=localStorage.getItem('activeRole')||''; let t=JSON.parse(localStorage.getItem('myTechV36')||'null'); let c=JSON.parse(localStorage.getItem('myClient')||'null'); if(active==='client' && c) return c; if(active==='tech' && t) return t; if(t) return t; if(c) return c; if(localStorage.getItem('adminOK')==='1') return {name:'Admin',email:'admin@housecalls.com',phone:'admin',photo:'https://via.placeholder.com/40?text=A',type:'admin'}; return null; }
function getMyId(){ let me=getMe(); return me? me.email : 'guest'; }
function toast(m,ty){ let d=document.createElement('div'); d.className='px-4 py-2 rounded-xl text-xs font-bold text-white shadow-lg '+(ty==='err'?'bg-red-600':'bg-green-600'); d.innerText=m; document.getElementById('notif').appendChild(d); setTimeout(()=>d.remove(),3000); }
function getGPS(){ document.getElementById('locLab').innerText='📍 Eldoret'; showTab('mapTab'); initMap(); }
function getReviews(email){ let all=JSON.parse(localStorage.getItem('reviews_all')||'{}'); return all[email]||[]; }
function getAvg(email){ let revs=getReviews(email); if(revs.length===0) return {avg:0,count:0}; let sum=revs.reduce((a,b)=>a+b.stars,0); return {avg:(sum/revs.length).toFixed(1),count:revs.length}; }
function setStars(n){ curStars=n; for(let i=1;i<=5;i++){ document.getElementById('st'+i).innerText=i<=n?'★':'☆'; } }
function openReview(email,name){ curRevEmail=email; curStars=0; document.getElementById('revName').innerText=name; let me=getMe(); document.getElementById('revBy').value=me?me.name:'Guest'; document.getElementById('revText').value=''; for(let i=1;i<=5;i++) document.getElementById('st'+i).innerText='☆'; document.getElementById('revModal').classList.remove('hidden'); }
function closeRev(){ document.getElementById('revModal').classList.add('hidden'); }
function closePublic(){ document.getElementById('publicModal').classList.add('hidden'); }
function submitReview(){ let by=document.getElementById('revBy').value.trim()||'Guest'; let text=document.getElementById('revText').value.trim(); if(curStars===0){toast('Select stars','err');return;} if(!text){toast('Write review','err');return;} let all=JSON.parse(localStorage.getItem('reviews_all')||'{}'); if(!all[curRevEmail]) all[curRevEmail]=[]; all[curRevEmail].push({by,stars:curStars,text,time:Date.now()}); localStorage.setItem('reviews_all',JSON.stringify(all)); closeRev(); toast('⭐ Public review posted!','ok'); renderHome(); loadAdminFixed(); renderPublicWall(); }
function renderPublicWall(){ let all=JSON.parse(localStorage.getItem('reviews_all')||'{}'); let wall=document.getElementById('reviewsWall'); let html=''; for(let email in all){ all[email].forEach(rv=>{ html+='<div class="bg-pink-50 border p-2 rounded-xl text-[11px]"><b>'+rv.by+'</b> reviewed <b>'+email+'</b> '+('★'.repeat(rv.stars))+'<br>'+rv.text+'<br><span class="text-[9px] text-gray-400">'+new Date(rv.time).toLocaleString()+'</span></div>'; }); } if(wall) wall.innerHTML=html||'<span class="text-[11px] text-gray-400">No public reviews yet</span>'; }
function timeAgo(ts){ let diff=Math.floor((Date.now()-ts)/1000); if(diff<60) return 'Online now'; if(diff<3600) return 'Last seen '+Math.floor(diff/60)+'m ago'; if(diff<86400) return 'Last seen '+Math.floor(diff/3600)+'h ago'; return 'Last seen '+Math.floor(diff/86400)+'d ago'; }
function isOnline(ts){ return (Date.now()-ts)<120000; }
function enableNotif(){ if(!('Notification' in window)){ toast('Not supported','err'); return; } Notification.requestPermission().then(p=>{ if(p==='granted'){ toast('🔔 Enabled!','ok'); showNotif('Ready','Popups enabled'); } }); }
function showNotif(title,body){ if(!('Notification' in window)) return; if(Notification.permission!=='granted') return; try{ new Notification(title,{body}); }catch(e){} }
function updateOnlineStatus(){ let me=getMe(); if(!me) return; me.lastSeen=Date.now(); me.online=true; if(me.type==='tech'){ localStorage.setItem('myTechV36',JSON.stringify(me)); let all=JSON.parse(localStorage.getItem('allTechs')||'[]'); let i=all.findIndex(t=>t.email===me.email); if(i>-1){ all[i].lastSeen=me.lastSeen; all[i].online=true; localStorage.setItem('allTechs',JSON.stringify(all)); } } if(me.type==='client'){ localStorage.setItem('myClient',JSON.stringify(me)); let all=JSON.parse(localStorage.getItem('allTechs')||'[]'); let i=all.findIndex(t=>t.email===me.email); if(i>-1){ all[i].lastSeen=me.lastSeen; all[i].online=true; localStorage.setItem('allTechs',JSON.stringify(all)); } let allC=JSON.parse(localStorage.getItem('allClients')||'[]'); let j=allC.findIndex(t=>t.email===me.email); if(j>-1){ allC[j].lastSeen=me.lastSeen; allC[j].online=true; localStorage.setItem('allClients',JSON.stringify(allC)); } } }
function updateRoleBanner(){ let me=getMe(); let banner=document.getElementById('roleBanner'); let info=document.getElementById('loggedInfo'); if(!me){ if(banner) banner.classList.add('hidden'); if(info) info.innerHTML='Not logged'; return; } if(banner){ banner.classList.remove('hidden'); if(me.type==='tech'){ banner.innerHTML='<b>🔒 Tech Dashboard: '+me.name+' - Ksh '+me.salary+'</b> 🟢 <button onclick="logoutRole()" class="bg-red-600 text-white px-3 py-1 rounded-full text-[10px] ml-2">Logout</button>'; } else if(me.type==='client'){ banner.innerHTML='<b>🔒 Client Dashboard: '+me.name+' - '+me.location+'</b> 🟢 <button onclick="logoutRole()" class="bg-red-600 text-white px-3 py-1 rounded-full text-[10px] ml-2">Logout</button>'; } else { banner.innerHTML='<b>👑 Admin</b> 🟢 <button onclick="aLogout()" class="bg-red-600 text-white px-3 py-1 rounded-full text-[10px] ml-2">Logout</button>'; } } if(info){ info.innerHTML='<b>Logged: '+me.name+' ['+me.type.toUpperCase()+'] 🟢 Online</b>'; } }
function logoutRole(){ let me=getMe(); if(me){ let all=JSON.parse(localStorage.getItem('allTechs')||'[]'); let i=all.findIndex(t=>t.email===me.email); if(i>-1){ all[i].online=false; all[i].lastSeen=Date.now(); localStorage.setItem('allTechs',JSON.stringify(all)); } } localStorage.removeItem('activeRole'); localStorage.removeItem('myTechV36'); localStorage.removeItem('myClient'); localStorage.removeItem('adminOK'); toast('Logged out','ok'); showTab('home'); }
function renderTechTab(){
 let me=getMe(); let active=localStorage.getItem('activeRole'); let div=document.getElementById('techLock');
 if(active==='client' && me && me.type==='client'){ div.innerHTML='<div class="text-center p-6"><h2 class="font-bold">You are CLIENT: '+me.name+'</h2><button onclick="logoutRole()" class="mt-4 bg-red-600 text-white px-6 py-2 rounded-full">Logout to become Tech</button></div>'; return; }
 if(active==='tech' && me && me.type==='tech'){
  let works=(me.portfolio||[]).map((w,i)=>'<div class="relative"><img src="'+w+'" class="w-full h-28 object-cover rounded-xl border"><button onclick="delWork('+i+')" class="absolute top-1 right-1 bg-red-600 text-white w-6 h-6 rounded-full text-[10px]">X</button><span class="absolute bottom-1 left-1 bg-black/60 text-white text-[8px] px-1 rounded">Public</span></div>').join('');
  div.innerHTML='<h2 class="font-bold text-sm">💇 Tech Dashboard - Public Profile Editor (Collins)</h2><div class="bg-pink-50 p-3 rounded-xl mt-3 border"><b class="text-xs">My PUBLIC Profile - Clients see this</b><div class="flex gap-3 mt-2"><div class="text-center"><div class="relative"><img id="pImg" src="'+me.photo+'" class="w-24 h-24 rounded-full object-cover border-4 border-pink-200"><div class="dot-online"></div></div><input type="file" accept="image/*" onchange="toB64(this,\'pImg\',\'pB64\'); setTimeout(updateTechPhoto,500)" class="text-[9px] mt-1 block"><span class="text-[9px]">Change public photo</span></div><div class="flex-1 space-y-2"><input id="nName" value="'+me.name+'" placeholder="Name" class="w-full p-2 border rounded-xl text-sm"><input id="nExp" value="'+(me.experience||'')+'" placeholder="Experience e.g. 5 Years braids & nails" class="w-full p-2 border rounded-xl text-sm"><input id="nSalary" value="'+(me.salary||'')+'" placeholder="Salary e.g. Ksh 1500 per service" class="w-full p-2 border rounded-xl text-sm"><input id="nArea" value="'+me.area+'" placeholder="Area Zion Mall" class="w-full p-2 border rounded-xl text-sm"><input id="nBio" value="'+(me.bio||'')+'" placeholder="About e.g. Best in Eldoret" class="w-full p-2 border rounded-xl text-sm"><button onclick="updateTechProfile()" class="bg-black text-white px-4 py-2 rounded-full text-xs w-full">Update PUBLIC Profile</button></div></div><p class="text-[10px] text-green-600 mt-2">✅ Public: Photo + Experience + Salary + Works will be visible to all clients when they click you</p></div><div class="bg-white p-3 rounded-xl mt-3 border"><b class="text-xs">📸 My PUBLIC Works - Clients see these photos</b><div class="grid grid-cols-3 gap-2 mt-2">'+(works||'<span class="text-[11px] text-gray-400">No public works yet - Upload</span>')+'</div><div class="flex gap-2 mt-2"><input type="file" accept="image/*" id="workFile" class="text-xs"><button onclick="uploadWork()" class="bg-pink-600 text-white px-4 py-2 rounded-full text-xs">Upload PUBLIC Work</button></div><p class="text-[9px] text-gray-500 mt-1">These photos are public - Any client browsing can see them in your profile</p></div><div class="flex gap-2 mt-3"><button onclick="showTab(\'home\')" class="bg-purple-600 text-white px-4 py-2 rounded-full text-xs">View My Public Profile</button><button onclick="logoutRole()" class="bg-red-600 text-white px-4 py-2 rounded-full text-xs">Logout</button></div>';
  return;
 }
 div.innerHTML='<h2 class="font-bold text-sm">Create Tech PUBLIC Account - Collins</h2><p class="text-[11px] text-gray-500">This will be PUBLIC - Clients will see your salary, experience & works</p><div class="flex gap-3 mt-3"><div class="text-center"><img id="pImg" src="https://via.placeholder.com/100?text=Photo" class="w-24 h-24 rounded-full object-cover border-4 border-pink-200"><input type="file" accept="image/*" onchange="toB64(this,\'pImg\',\'pB64\')" class="text-[10px] mt-1 block"><span class="text-[9px]">Public photo</span></div><div class="flex-1 space-y-2"><input id="nName" placeholder="Name Collins Otieno" class="w-full p-2.5 border rounded-xl text-sm"><input id="nEmail" placeholder="Email private" class="w-full p-2.5 border rounded-xl text-sm"><input id="nPhone" placeholder="Phone private" class="w-full p-2.5 border rounded-xl text-sm"><input id="nExp" placeholder="Experience e.g. 3 Years - Braids Expert" class="w-full p-2.5 border rounded-xl text-sm"><input id="nSalary" placeholder="Salary e.g. Ksh 1500 Gel Nails / Ksh 2000 Braids" class="w-full p-2.5 border rounded-xl text-sm"><input id="nArea" placeholder="Area Zion Mall Eldoret" class="w-full p-2.5 border rounded-xl text-sm"><input id="nBio" placeholder="About - Best tech in Eldoret" class="w-full p-2.5 border rounded-xl text-sm"></div></div><button onclick="saveTech()" class="w-full bg-gradient-to-r from-pink-600 to-purple-600 text-white py-3 rounded-xl font-bold text-sm mt-3">Create PUBLIC Tech Profile + Lock</button>';
}
function updateTechPhoto(){ let me=JSON.parse(localStorage.getItem('myTechV36')||'null'); if(!me) return; me.photo=localStorage.getItem('pB64')||me.photo; localStorage.setItem('myTechV36',JSON.stringify(me)); let all=JSON.parse(localStorage.getItem('allTechs')||'[]'); let i=all.findIndex(t=>t.email===me.email); if(i>-1){ all[i].photo=me.photo; localStorage.setItem('allTechs',JSON.stringify(all)); } toast('Public photo updated','ok'); }
function updateTechProfile(){ let me=JSON.parse(localStorage.getItem('myTechV36')||'null'); if(!me) return; me.name=document.getElementById('nName').value||me.name; me.experience=document.getElementById('nExp').value||me.experience; me.salary=document.getElementById('nSalary').value||me.salary; me.area=document.getElementById('nArea').value||me.area; me.bio=document.getElementById('nBio').value||me.bio; localStorage.setItem('myTechV36',JSON.stringify(me)); let all=JSON.parse(localStorage.getItem('allTechs')||'[]'); let i=all.findIndex(t=>t.email===me.email); if(i>-1){ all[i].name=me.name; all[i].experience=me.experience; all[i].salary=me.salary; all[i].area=me.area; all[i].bio=me.bio; localStorage.setItem('allTechs',JSON.stringify(all)); } toast('PUBLIC profile updated - Clients will see salary & experience','ok'); renderTechTab(); renderHome(); }
function uploadWork(){ let f=document.getElementById('workFile').files[0]; if(!f) return toast('Select image','err'); let r=new FileReader(); r.onload=e=>{ let me=JSON.parse(localStorage.getItem('myTechV36')||'null'); if(!me.portfolio) me.portfolio=[]; me.portfolio.push(e.target.result); localStorage.setItem('myTechV36',JSON.stringify(me)); let all=JSON.parse(localStorage.getItem('allTechs')||'[]'); let i=all.findIndex(t=>t.email===me.email); if(i>-1){ if(!all[i].portfolio) all[i].portfolio=[]; all[i].portfolio.push(e.target.result); localStorage.setItem('allTechs',JSON.stringify(all)); } toast('PUBLIC work uploaded - Clients see it now!','ok'); renderTechTab(); renderHome(); }; r.readAsDataURL(f); }
function delWork(idx){ let me=JSON.parse(localStorage.getItem('myTechV36')||'null'); me.portfolio.splice(idx,1); localStorage.setItem('myTechV36',JSON.stringify(me)); let all=JSON.parse(localStorage.getItem('allTechs')||'[]'); let i=all.findIndex(t=>t.email===me.email); if(i>-1){ all[i].portfolio=me.portfolio; localStorage.setItem('allTechs',JSON.stringify(all)); } renderTechTab(); }
function renderClientTab(){
 let me=getMe(); let active=localStorage.getItem('activeRole'); let div=document.getElementById('clientLock');

  let ch=[]; rec.ondataavailable=e=>{ if(e.data.size>0) ch.push(e.data); };

  rec.start(250); btn.innerHTML='<i class="fas fa-stop text-red-600 animate-pulse"></i>'; setTimeout(()=>{ if(rec && rec.state==='recording'){ rec.stop(); btn.innerHTML='<i class="fas fa-microphone text-pink-600"></i>'; } },15000);

function approveTech(email){ let all=JSON.parse(localStorage.getItem('allTechs')||'[]'); let i=all.findIndex(t=>t.email===email); if(i>-1){all[i].approved=true;localStorage.setItem('allTechs',JSON.stringify(all));} let my=JSON.parse(localStorage.getItem('myTechV36')||'null'); if(my&&my.email===email){my.approved=true;localStorage.setItem('myTechV36',JSON.stringify(my));} showNotif('✅ Approved!', email); toast('✅ APPROVED - Now PUBLIC','ok');loadAdminFixed();renderHome(); }
