<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V41 FINAL 3 Parts</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><style>.msg-me{margin-left:auto;background:linear-gradient(135deg,#e91e8c,#9333ea);color:#fff;border-radius:18px 18px 4px 18px}.msg-other{margin-right:auto;background:#fff;border:1px solid #e5e7eb;border-radius:18px 18px 18px 4px}</style></head><body class="bg-[#fff5f7] min-h-screen pb-20">
<div id="notif" class="fixed top-3 right-3 z-[9999] space-y-2"></div>
<div id="revModal" class="hidden fixed inset-0 bg-black/50 z-[100] flex items-center justify-center p-4"><div class="bg-white rounded-2xl p-5 w-full max-w-sm"><h3 class="font-bold text-sm">⭐ Review <span id="revName"></span></h3><div class="flex gap-1 mt-3 text-2xl"><span onclick="setStars(1)" id="st1" class="cursor-pointer">☆</span><span onclick="setStars(2)" id="st2" class="cursor-pointer">☆</span><span onclick="setStars(3)" id="st3" class="cursor-pointer">☆</span><span onclick="setStars(4)" id="st4" class="cursor-pointer">☆</span><span onclick="setStars(5)" id="st5" class="cursor-pointer">☆</span></div><input id="revBy" placeholder="Your Name" class="w-full mt-3 p-2.5 border rounded-xl text-sm"><textarea id="revText" placeholder="Review..." class="w-full mt-2 p-2.5 border rounded-xl text-sm h-20"></textarea><div class="flex gap-2 mt-3"><button onclick="closeRev()" class="flex-1 bg-gray-100 py-2.5 rounded-xl">Cancel</button><button onclick="submitReview()" class="flex-1 bg-pink-600 text-white py-2.5 rounded-xl font-bold">Submit</button></div></div></div>
<header class="bg-gradient-to-r from-pink-600 to-purple-600 text-white p-2 sticky top-0 z-50 flex justify-between items-center"><b class="text-[10px]"> HOUSE CALLS </b><div class="flex gap-1 text-[9px]"><button onclick="showTab('home')" id="bh" class="bg-white text-pink-600 px-2 py-1 rounded-full font-bold">Home</button><button onclick="showTab('chat')" id="bc" class="bg-white/20 px-2 py-1 rounded-full">Chat</button><button onclick="showTab('profile')" id="bp" class="bg-white/20 px-2 py-1 rounded-full">Tech</button><button onclick="showTab('client')" id="bcl" class="bg-white/20 px-2 py-1 rounded-full">Client</button><button onclick="showTab('admin')" id="ba" class="bg-black/20 px-2 py-1 rounded-full">Admin</button></div></header>
<div id="home" class="max-w-5xl mx-auto p-2"><div id="roleBanner" class="bg-white rounded-xl p-3 border mb-2 text-xs hidden"></div><div class="bg-white rounded-xl p-2 flex justify-between text-xs border"><b>Home - Privacy Protected</b><button onclick="getGPS()" class="bg-purple-600 text-white px-3 py-1 rounded-full"><span id="locLab">📍 GPS</span></button></div><div id="empty" class="bg-white rounded-xl p-6 text-center mt-3 border"><h3 class="font-bold text-sm">No profiles yet</h3><button onclick="showTab('profile')" class="mt-3 bg-pink-600 text-white px-5 py-2 rounded-full text-xs">Create Profile</button></div><div id="grid" class="grid md:grid-cols-2 gap-2 mt-2"></div></div>
  <div id="chat" class="hidden max-w-3xl mx-auto p-2"><div class="bg-white rounded-xl h-[80vh] flex flex-col shadow border"><div class="p-3 border-b bg-pink-50"><b class="text-xs">🔒 Private Chat - WhatsApp Style</b><div id="loggedInfo" class="text-[10px] mt-1 bg-white border p-2 rounded-xl"></div><div class="flex gap-2 mt-2"><select id="chatTarget" onchange="renderChat()" class="flex-1 text-xs border-2 border-pink-200 rounded-full px-3 py-2 bg-white font-bold"></select></div><div id="chatInfo" class="text-[10px] text-purple-600 mt-1 font-bold"></div></div><div id="chatBox" class="flex-1 overflow-y-auto p-3 space-y-3 bg-[#faf5f6]"></div><div class="p-2 border-t flex gap-2 items-center bg-white"><button onclick="voiceMsg()" id="vBtn" class="bg-gray-100 w-10 h-10 rounded-full"><i class="fas fa-microphone text-pink-600"></i></button><input id="cInput" placeholder="Type private message..." class="flex-1 p-3 border rounded-full text-sm" onkeypress="if(event.key==='Enter')sendChat()"><button onclick="sendChat()" class="bg-pink-600 text-white w-10 h-10 rounded-full"><i class="fas fa-paper-plane text-xs"></i></button></div></div></div>
<div id="profile" class="hidden max-w-2xl mx-auto p-2"><div id="techLock" class="bg-white rounded-xl p-4 border"></div></div>
<div id="client" class="hidden max-w-2xl mx-auto p-2"><div id="clientLock" class="bg-white rounded-xl p-4 border"></div></div>
<div id="admin" class="hidden max-w-4xl mx-auto p-2"><div id="aLogin" class="bg-white rounded-xl p-6 max-w-sm mx-auto mt-10 text-center border shadow"><h2 class="font-bold text-sm">Admin Login</h2><div class="relative mt-3"><input id="aPass" type="password" placeholder="Enter Admin Password" class="w-full p-3 border rounded-xl text-sm pr-10"><button onclick="toggleEye()" class="absolute right-3 top-3 text-gray-400"><i id="eye" class="fas fa-eye"></i></button></div><button onclick="doAdminLogin()" class="w-full bg-black text-white py-3 rounded-xl mt-3 font-bold text-sm">Login</button></div><div id="aPanel" class="hidden space-y-2"><div class="bg-white p-3 rounded-xl flex justify-between border"><b class="text-[11px]">Admin - Full Details Only Here</b><button onclick="aLogout()" class="text-[10px] bg-gray-100 px-3 py-1 rounded-full">Logout</button></div><div class="bg-white p-3 rounded-xl border"><b class="text-xs">Pending Techs</b><div id="aPend" class="mt-2 space-y-2"></div></div><div class="bg-white p-3 rounded-xl border"><b class="text-xs">Approved - Privacy Safe</b><div id="aAppr" class="mt-2 space-y-2"></div></div><div class="bg-white p-3 rounded-xl border"><b class="text-xs">⭐ All Reviews</b><div id="aReviews" class="mt-2"></div></div></div></div>
<script>
const ADMIN="EldoretAdmin2026!"; let rec=null; let curRevEmail=''; let curStars=0;
function showTab(t){
 let active=localStorage.getItem('activeRole');
 let isTech=active==='tech' && JSON.parse(localStorage.getItem('myTechV36')||'null');
 let isClient=active==='client' && JSON.parse(localStorage.getItem('myClient')||'null');
 if(t==='client' && isTech){ toast('You are TECH - Logout to become Client','err'); return; }
 if(t==='profile' && isClient){ toast('You are CLIENT - Logout to become Tech','err'); return; }
 ['home','chat','profile','client','admin'].forEach(x=>{
  let el=document.getElementById(x); if(el) el.classList.add('hidden');
  let bId = x==='client'? 'bcl' : 'b'+x[0];
  let b=document.getElementById(bId); if(b) b.className='bg-white/20 px-2 py-1 rounded-full';
 });
 let cur=document.getElementById(t); if(cur) cur.classList.remove('hidden');
 let id = t==='client'? 'bcl' : 'b'+t[0];
 let ab=document.getElementById(id); if(ab) ab.className='bg-white text-pink-600 px-2 py-1 rounded-full font-bold';
 if(t==='home') renderHome(); if(t==='chat') renderChat(); if(t==='profile') renderTechTab(); if(t==='client') renderClientTab(); if(t==='admin') checkAdmin(); updateRoleBanner();
}
function toB64(inp,imgId,key){ let f=inp.files[0]; if(!f) return; let r=new FileReader(); r.onload=e=>{ document.getElementById(imgId).src=e.target.result; localStorage.setItem(key,e.target.result); }; r.readAsDataURL(f); }
function toggleEye(){ let p=document.getElementById('aPass'); let e=document.getElementById('eye'); if(p.type==='password'){ p.type='text'; e.className='fas fa-eye-slash'; } else { p.type='password'; e.className='fas fa-eye'; } }
function getMe(){ let active=localStorage.getItem('activeRole')||''; let t=JSON.parse(localStorage.getItem('myTechV36')||'null'); let c=JSON.parse(localStorage.getItem('myClient')||'null'); if(active==='client' && c) return c; if(active==='tech' && t) return t; if(t) return t; if(c) return c; if(localStorage.getItem('adminOK')==='1') return {name:'Admin',email:'admin@housecalls.com',phone:'admin',photo:'https://via.placeholder.com/40?text=A',type:'admin'}; return null; }
function getMyId(){ let me=getMe(); return me? me.email : 'guest'; }
function toast(m,ty){ let d=document.createElement('div'); d.className='px-4 py-2 rounded-xl text-xs font-bold text-white shadow-lg '+(ty==='err'?'bg-red-600':'bg-green-600'); d.innerText=m; document.getElementById('notif').appendChild(d); setTimeout(()=>d.remove(),3000); }
function getGPS(){ document.getElementById('locLab').innerText='📍 0.507'; }
function getReviews(email){ let all=JSON.parse(localStorage.getItem('reviews_all')||'{}'); return all[email]||[]; }
function getAvg(email){ let revs=getReviews(email); if(revs.length===0) return {avg:0,count:0}; let sum=revs.reduce((a,b)=>a+b.stars,0); return {avg:(sum/revs.length).toFixed(1),count:revs.length}; }
function setStars(n){ curStars=n; for(let i=1;i<=5;i++){ document.getElementById('st'+i).innerText=i<=n?'★':'☆'; } }
function openReview(email,name){ curRevEmail=email; curStars=0; document.getElementById('revName').innerText=name; let me=getMe(); document.getElementById('revBy').value=me?me.name:'Guest'; document.getElementById('revText').value=''; for(let i=1;i<=5;i++) document.getElementById('st'+i).innerText='☆'; document.getElementById('revModal').classList.remove('hidden'); }
function closeRev(){ document.getElementById('revModal').classList.add('hidden'); }
function submitReview(){ let by=document.getElementById('revBy').value.trim()||'Guest'; let text=document.getElementById('revText').value.trim(); if(curStars===0){toast('Select stars','err');return;} if(!text){toast('Write review','err');return;} let all=JSON.parse(localStorage.getItem('reviews_all')||'{}'); if(!all[curRevEmail]) all[curRevEmail]=[]; all[curRevEmail].push({by,stars:curStars,text,time:Date.now()}); localStorage.setItem('reviews_all',JSON.stringify(all)); closeRev(); toast('⭐ Review added','ok'); renderHome(); loadAdminFixed(); }
function updateRoleBanner(){ let me=getMe(); let banner=document.getElementById('roleBanner'); let info=document.getElementById('loggedInfo'); if(!me){ if(banner) banner.classList.add('hidden'); if(info) info.innerHTML='Not logged - Create Tech or Client'; return; } if(banner){ banner.classList.remove('hidden'); if(me.type==='tech'){ banner.innerHTML='<b>🔒 Logged as TECH: '+me.name+'</b> - Cannot become Client until logout <button onclick="logoutRole()" class="bg-red-600 text-white px-3 py-1 rounded-full text-[10px] ml-2">Logout</button>'; } else if(me.type==='client'){ banner.innerHTML='<b>🔒 Logged as CLIENT: '+me.name+'</b> - Cannot become Tech until logout <button onclick="logoutRole()" class="bg-red-600 text-white px-3 py-1 rounded-full text-[10px] ml-2">Logout</button>'; } else { banner.innerHTML='<b>👑 Admin</b> <button onclick="aLogout()" class="bg-red-600 text-white px-3 py-1 rounded-full text-[10px] ml-2">Logout</button>'; } } if(info){ info.innerHTML='<b>Logged as: '+me.name+' ['+me.type.toUpperCase()+']</b> <button onclick="logoutRole()" class="bg-gray-200 px-2 py-0.5 rounded-full text-[9px] ml-2">Logout</button>'; } }
function logoutRole(){ localStorage.removeItem('activeRole'); localStorage.removeItem('myTechV36'); localStorage.removeItem('myClient'); localStorage.removeItem('adminOK'); toast('Logged out','ok'); let b=document.getElementById('roleBanner'); if(b) b.classList.add('hidden'); showTab('home'); renderTechTab(); renderClientTab(); renderHome(); }
function renderTechTab(){ let me=getMe(); let active=localStorage.getItem('activeRole'); let div=document.getElementById('techLock'); if(active==='client' && me && me.type==='client'){ div.innerHTML='<div class="text-center p-6"><h2 class="font-bold">You are CLIENT: '+me.name+'</h2><p class="text-xs mt-2">Client cannot be Tech. Logout first.</p><button onclick="logoutRole()" class="mt-4 bg-red-600 text-white px-6 py-2 rounded-full">Logout</button></div>'; return; } if(active==='tech' && me && me.type==='tech'){ div.innerHTML='<div class="text-center p-6"><h2 class="font-bold">✅ Logged as TECH: '+me.name+'</h2><img src="'+me.photo+'" class="w-20 h-20 rounded-full mx-auto mt-3"><p class="text-xs mt-2">'+(me.area||'')+'</p><button onclick="logoutRole()" class="mt-4 bg-red-600 text-white px-6 py-2 rounded-full">Logout</button></div>'; return; } div.innerHTML='<h2 class="font-bold text-sm">Tech Profile - Tech=Tech Only</h2><div class="flex gap-3 mt-3"><div class="text-center"><img id="pImg" src="https://via.placeholder.com/100?text=Photo" class="w-24 h-24 rounded-full object-cover border-4 border-pink-200"><input type="file" accept="image/*" onchange="toB64(this,\'pImg\',\'pB64\')" class="text-[10px] mt-1 block"></div><div class="flex-1 space-y-2"><input id="nName" placeholder="Name Collins Otieno" class="w-full p-2.5 border rounded-xl text-sm"><input id="nEmail" placeholder="Email private" class="w-full p-2.5 border rounded-xl text-sm"><input id="nPhone" placeholder="Phone private" class="w-full p-2.5 border rounded-xl text-sm"><input id="nArea" placeholder="Area Zion Mall" class="w-full p-2.5 border rounded-xl text-sm"></div></div><button onclick="saveTech()" class="w-full bg-gradient-to-r from-pink-600 to-purple-600 text-white py-3 rounded-xl font-bold text-sm mt-3">Save Tech + Lock as Tech</button>'; }
function renderClientTab(){ let me=getMe(); let active=localStorage.getItem('activeRole'); let div=document.getElementById('clientLock'); if(active==='tech' && me && me.type==='tech'){ div.innerHTML='<div class="text-center p-6"><h2 class="font-bold">You are TECH: '+me.name+'</h2><p class="text-xs mt-2">Tech cannot be Client. Logout first.</p><button onclick="logoutRole()" class="mt-4 bg-red-600 text-white px-6 py-2 rounded-full">Logout</button></div>'; return; } if(active==='client' && me && me.type==='client'){ div.innerHTML='<div class="text-center p-6"><h2 class="font-bold">✅ Logged as CLIENT: '+me.name+'</h2><img src="'+me.photo+'" class="w-20 h-20 rounded-full mx-auto mt-3"><p class="text-xs mt-2">'+(me.location||me.area||'')+'</p><button onclick="logoutRole()" class="mt-4 bg-red-600 text-white px-6 py-2 rounded-full">Logout</button></div>'; return; } div.innerHTML='<h2 class="font-bold text-sm">Client Profile - Client=Client Only</h2><div class="grid grid-cols-2 gap-2 mt-3"><input id="clName" placeholder="Name Maureen" class="p-2.5 border rounded-xl text-sm"><input id="clPhone" placeholder="Phone private" class="p-2.5 border rounded-xl text-sm"><input id="clLoc" placeholder="Location Zion Mall" class="p-2.5 border rounded-xl text-sm"><input id="clDate" type="date" class="p-2.5 border rounded-xl text-sm"><input id="clTime" type="time" class="p-2.5 border rounded-xl text-sm"><select id="clService" class="p-2.5 border rounded-xl text-sm"><option>Gel Nails</option><option>Braids</option></select></div><div class="flex gap-2 items-center border p-2 rounded-xl mt-2"><img id="clImg" src="https://via.placeholder.com/60?text=Client" class="w-12 h-12 rounded-full"><input type="file" accept="image/*" onchange="toB64(this,\'clImg\',\'clB64\')" class="text-[10px]"><label class="flex items-center gap-1 text-xs font-bold ml-auto"><input type="checkbox" id="clBooked" class="accent-pink-600"> BOOKED</label></div><button onclick="saveClientDashboard()" class="w-full bg-black text-white py-3 rounded-xl font-bold text-sm mt-3">Save Client + Lock as Client</button><div id="clientList" class="space-y-2 mt-3"></div>'; }
function saveTech(){ let name=document.getElementById('nName').value.trim()||'Collins Otieno'; let email=document.getElementById('nEmail').value.trim()||'tech'+Date.now()+'@housecalls.com'; let phone=document.getElementById('nPhone').value.trim()||'07xxxxxxxx'; let tech={name,email,phone,area:document.getElementById('nArea').value||'Zion Mall',bio:'Tech',photo:localStorage.getItem('pB64')||'https://via.placeholder.com/100',portfolio:[],approved:false,online:true,lastSeen:Date.now(),status:'available',type:'tech',time:Date.now()}; localStorage.setItem('myTechV36',JSON.stringify(tech)); localStorage.setItem('activeRole','tech'); localStorage.removeItem('myClient'); let all=JSON.parse(localStorage.getItem('allTechs')||'[]'); all=all.filter(t=>t.email!==email); all.push(tech); localStorage.setItem('allTechs',JSON.stringify(all)); toast('✅ Tech '+name+' saved','ok'); showTab('home'); renderHome(); }
function saveClientDashboard(){ let name=document.getElementById('clName').value.trim()||'Maureen'; let phone=document.getElementById('clPhone').value.trim()||'07xxxxxxxx'; let email=name.toLowerCase().replace(/\s/g,'')+Date.now()+'@client.com'; let loc=document.getElementById('clLoc').value||'Zion Mall'; let client={name,email,phone,area:loc,bio:'Client',photo:localStorage.getItem('clB64')||'https://via.placeholder.com/60',portfolio:[],location:loc,date:document.getElementById('clDate').value||'2026-09-10',time:document.getElementById('clTime').value||'12:07',service:document.getElementById('clService').value||'Gel Nails',booked:document.getElementById('clBooked').checked||false,online:true,lastSeen:Date.now(),status:'available',type:'client',approved:true,time:Date.now()}; localStorage.setItem('myClient',JSON.stringify(client)); localStorage.setItem('activeRole','client'); localStorage.removeItem('myTechV36'); let all=JSON.parse(localStorage.getItem('allTechs')||'[]'); all=all.filter(t=>t.email!==email); all.push(client); localStorage.setItem('allTechs',JSON.stringify(all)); let allC=JSON.parse(localStorage.getItem('allClients')||'[]'); allC=allC.filter(c=>c.email!==email); allC.push(client); localStorage.setItem('allClients',JSON.stringify(allC)); toast('✅ Client '+name+' saved','ok'); renderHome(); showTab('home'); }
function renderHome(){ let all=JSON.parse(localStorage.getItem('allTechs')||'[]'); let appr=all.filter(t=>t.approved); let grid=document.getElementById('grid'); let empty=document.getElementById('empty'); if(appr.length===0){ empty.classList.remove('hidden'); grid.innerHTML=''; return; } empty.classList.add('hidden'); grid.innerHTML=appr.map(t=>{ let r=getAvg(t.email); let stars=r.count===0?'No reviews':''+r.avg+' ⭐ ('+r.count+')'; let revs=getReviews(t.email); let revHtml=revs.slice(-1).map(rv=>'<div class="bg-yellow-50 border p-2 rounded-xl mt-1 text-[11px]"><b>'+rv.by+'</b> '+('★'.repeat(rv.stars))+'<br>'+rv.text+'</div>').join(''); let lbl=t.type==='client'?'CLIENT':'TECH'; let booked=t.booked?'<span class="bg-red-600 text-white px-2 py-0.5 rounded-full text-[9px]">BOOKED</span>':'<span class="bg-green-100 px-2 py-0.5 rounded-full text-[9px]">Available</span>'; return '<div class="bg-white rounded-xl border p-3 shadow-sm"><div class="flex gap-2"><img src="'+t.photo+'" class="w-12 h-12 rounded-full object-cover"><div class="flex-1"><b class="text-sm">'+t.name+'</b> ['+lbl+']<p class="text-[10px] text-gray-500">'+(t.location||t.area||'')+' • '+(t.service||'')+'</p><p class="text-[11px] mt-1">'+stars+' '+booked+'</p></div></div>'+revHtml+'<div class="flex gap-2 mt-3"><button onclick="startPrivateChat(\''+t.email+'\')" class="flex-1 bg-pink-600 text-white py-2 rounded-full text-xs font-bold">💬 Private Chat</button><button onclick="openReview(\''+t.email+'\',\''+t.name+'\')" class="flex-1 bg-yellow-500 text-white py-2 rounded-full text-xs font-bold">⭐ Review</button></div><p class="text-[8px] text-gray-400 mt-2">Privacy protected</p></div>'; }).join(''); updateRoleBanner(); }
function startPrivateChat(email){ showTab('chat'); let sel=document.getElementById('chatTarget'); if(sel){ sel.value=email; renderChat(); } }
function renderChat(){ let all=JSON.parse(localStorage.getItem('allTechs')||'[]'); let me=getMe(); if(!me){ document.getElementById('chatBox').innerHTML='<div class="text-center mt-10 text-xs">Login first<br><button onclick="showTab(\'profile\')" class="bg-pink-600 text-white px-4 py-2 rounded-full mt-2">Tech</button> <button onclick="showTab(\'client\')" class="bg-black text-white px-4 py-2 rounded-full mt-2">Client</button></div>'; return; } let myId=getMyId(); let sel=document.getElementById('chatTarget'); let current=sel?sel.value:''; let options=''; all.forEach(t=>{ if(t.email===myId) return; let icon=t.type==='client'?'👤 Client':'💇 Tech'; options+='<option value="'+t.email+'">'+icon+' '+t.name+' - '+t.type+'</option>'; }); options+='<option value="admin@housecalls.com">👑 Admin</option>'; if(sel) sel.innerHTML=options; if(current) sel.value=current; let chats=JSON.parse(localStorage.getItem('chats')||'[]'); drawChats(chats); }
function drawChats(chats){ let box=document.getElementById('chatBox'); if(!box) return; let me=getMe(); if(!me) return; let myId=getMyId(); let target=document.getElementById('chatTarget')?document.getElementById('chatTarget').value:''; if(!target){ box.innerHTML='<div class="text-center text-gray-400 text-xs mt-10">Select person to chat privately</div>'; return; } let filtered=chats.filter(m=> (m.from===myId && m.to===target) || (m.from===target && m.to===myId)); if(filtered.length===0){ box.innerHTML='<div class="text-center text-gray-400 text-xs mt-10">No messages with this person<br>You are <b>'+me.name+' ['+me.type+']</b><br>Start chat - only you two see</div>'; return; } box.innerHTML=filtered.map(m=>{ let isMe=m.from===myId; let time=m.time? new Date(m.time).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):''; let photo=m.photo||'https://via.placeholder.com/30'; let bubble=isMe?'msg-me':'msg-other'; let align=isMe?'justify-end':'justify-start'; let left=isMe?'':'<img src="'+photo+'" class="w-7 h-7 rounded-full">'; let right=isMe?'<img src="'+me.photo+'" class="w-7 h-7 rounded-full">':''; let voice=m.voice?'<audio controls src="'+m.voice+'" class="w-32 mt-1"></audio>':''; return '<div class="flex '+align+' gap-2 items-end w-full"><div class="flex '+align+' gap-2 items-end max-w-[80%]">'+left+'<div class="px-3 py-2 '+bubble+' shadow-sm"><b class="text-[9px] opacity-70 block">'+m.user+' • '+time+'</b><span class="text-[13px]">'+(m.text||'')+'</span>'+voice+'</div>'+right+'</div></div>'; }).join(''); box.scrollTop=box.scrollHeight; }
function sendChat(){ let t=document.getElementById('cInput').value.trim(); if(!t) return; let me=getMe(); if(!me){toast('Login first','err');return;} let myId=getMyId(); let sel=document.getElementById('chatTarget'); let target=sel?sel.value:''; if(!target){toast('Select person','err');return;} let targetName=sel.options[sel.selectedIndex]?sel.options[sel.selectedIndex].text:target; let msg={user:me.name,from:myId,to:target,toName:targetName,text:t,photo:me.photo,time:Date.now(),private:true}; let chats=JSON.parse(localStorage.getItem('chats')||'[]'); chats.push(msg); localStorage.setItem('chats',JSON.stringify(chats)); document.getElementById('cInput').value=''; drawChats(chats); }
 function voiceMsg(){
 let btn=document.getElementById('vBtn');
 if(rec && rec.state==='recording'){ rec.stop(); btn.innerHTML='<i class="fas fa-microphone text-pink-600"></i>'; return; }
 let sel=document.getElementById('chatTarget'); let target=sel?sel.value:''; if(!target){toast('Select person','err');return;}
 if(!navigator.mediaDevices){ toast('Mic not supported','err'); return; }
 navigator.mediaDevices.getUserMedia({audio:true}).then(s=>{
  rec=new MediaRecorder(s);
  let ch=[];
  rec.ondataavailable=e=>{ if(e.data.size>0) ch.push(e.data); };
  rec.onstop=()=>{
   let b=new Blob(ch,{type:'audio/webm'});
   let r=new FileReader();
   r.onload=e=>{
    let me=getMe();
    let myId=getMyId();
    let targetName=sel.options[sel.selectedIndex]?sel.options[sel.selectedIndex].text:target;
    let msg={user:me.name,from:myId,to:target,toName:targetName,text:'🎤 Voice',voice:e.target.result,photo:me.photo,time:Date.now(),private:true};
    let chats=JSON.parse(localStorage.getItem('chats')||'[]');
    chats.push(msg);
    localStorage.setItem('chats',JSON.stringify(chats));
    drawChats(chats);
   };
   r.readAsDataURL(b);
   s.getTracks().forEach(t=>t.stop());
  };
  rec.start();
  btn.innerHTML='<i class="fas fa-stop text-red-600 animate-pulse"></i>';
  setTimeout(()=>{
   if(rec && rec.state==='recording'){
    rec.stop();
    btn.innerHTML='<i class="fas fa-microphone text-pink-600"></i>';
   }
  },10000);
 }).catch(()=>toast('Allow mic','err'));
}

 let appr='';
 all.forEach(t=>{
  let r=getAvg(t.email);
  if(!t.approved && t.type==='tech'){
   pend+='<div class="bg-white border-2 border-orange-300 p-3 rounded-xl flex gap-3 text-xs"><img src="'+t.photo+'" class="w-14 h-14 rounded-full"><div><b>'+t.name+'</b> ['+t.type+']<br><span class="text-[10px] text-gray-500">Email: '+t.email+' (Admin only)</span><br><span class="text-[10px] text-gray-500">Phone: '+t.phone+' (Admin only)</span><br><button onclick="approveTech(\''+t.email+'\')" class="bg-green-600 text-white px-5 py-2 rounded-full font-bold mt-1">✅ Approve</button></div></div>';
  } else {
   appr+='<div class="bg-green-50 border p-2 rounded-xl text-xs"><b>'+t.name+'</b> ['+t.type.toUpperCase()+'] • ⭐ '+r.avg+' ('+r.count+')<br><span class="text-[10px] text-gray-500">Email: '+t.email+' - Phone: '+t.phone+'</span><br><span class="text-[10px]">'+(t.location||t.area||'')+'</span><div class="flex gap-1 mt-1"><button onclick="startPrivateChat(\''+t.email+'\')" class="bg-pink-600 text-white px-3 py-1 rounded-full text-[10px]">Chat</button></div></div>';
  }
 });
 document.getElementById('aPend').innerHTML=pend||'No pending';
 document.getElementById('aAppr').innerHTML=appr||'No approved';
 let allRev=JSON.parse(localStorage.getItem('reviews_all')||'{}');
 let rh='';

   rh+='<div class="bg-yellow-50 border p-2 rounded-xl text-xs"><b>'+rv.by+'</b> → '+email+' '+('★'.repeat(rv.stars))+'<br>'+rv.text+'</div>';
  });
 }
 document.getElementById('aReviews').innerHTML=rh||'No reviews';
}
function approveTech(email){
 let all=JSON.parse(localStorage.getItem('allTechs')||'[]');
 let i=all.findIndex(t=>t.email===email);
 if(i>-1){all[i].approved=true;localStorage.setItem('allTechs',JSON.stringify(all));}
 let my=JSON.parse(localStorage.getItem('myTechV36')||'null');
 if(my&&my.email===email){my.approved=true;localStorage.setItem('myTechV36',JSON.stringify(my));}
 toast('✅ APPROVED','ok');loadAdminFixed();renderHome();
}
