const firebaseConfig = { apiKey: "AIzaSyD5HtYXW1tdYcABGqpG_ZLJNidij_QSfOw", authDomain: "house-calls-eldoret.firebaseapp.com", databaseURL: "https://house-calls-eldoret-default-rtdb.firebaseio.com", projectId: "house-calls-eldoret", storageBucket: "house-calls-eldoret.firebasestorage.app", messagingSenderId: "952901879825", appId: "1:952901879825:web:c6faa910449dd7347789b0" };
firebase.initializeApp(firebaseConfig); const db=firebase.database(); const liveRef=db.ref('housecalls_v47_road_final'); const chatRef=db.ref('housecalls_private_chats_v47_final'); const usersRef=db.ref('housecalls_users_v47_final'); let isSyncingFromCloud=false; const ADMIN="EldoretAdmin2026!"; let rec=null; let curRevEmail=''; let curStars=0; let myMap=null; let myLat=0.5143; let myLng=35.2697; let routeLine=null; let watchId=null; let targetLat=null; let targetLng=null; let targetNameG=''; let allChatsCache=[]; let baseLayer=null; let satLayer=null;
function showTab(t){ let active=localStorage.getItem('activeRole'); let isTech=active==='tech'&&JSON.parse(localStorage.getItem('myTechV36')||'null'); let isClient=active==='client'&&JSON.parse(localStorage.getItem('myClient')||'null'); if(t==='client'&&isTech){toast('You are logged as Tech - Logout to open Client','err');return;} if(t==='profile'&&isClient){toast('You are logged as Client - Logout to open Tech','err');return;} ['home','chat','profile','client','mapTab','admin'].forEach(x=>{ let el=document.getElementById(x); if(el) el.classList.add('hidden'); let bId=x==='client'?'bcl':x==='mapTab'?'bm':'b'+x[0]; let b=document.getElementById(bId); if(b) b.className='bg-white/20 px-3 py-1 rounded-full'; }); document.getElementById(t).classList.remove('hidden'); let id=t==='client'?'bcl':t==='mapTab'?'bm':'b'+t[0]; document.getElementById(id).className='bg-white text-pink-600 px-3 py-1 rounded-full font-bold'; if(t==='home')renderHome(); if(t==='chat')renderChat(); if(t==='profile')renderTechTab(); if(t==='client')renderClientTab(); if(t==='mapTab')initMap(); if(t==='admin'){ checkAdmin(); renderAdminChat(); loadAdminFixed(); } updateRoleBanner(); }
function toB64(inp,imgId,key){ let f=inp.files[0]; if(!f) return; let r=new FileReader(); r.onload=e=>{ document.getElementById(imgId).src=e.target.result; localStorage.setItem(key,e.target.result); }; r.readAsDataURL(f); }
function toggleEye(){ let p=document.getElementById('aPass'); let e=document.getElementById('eye'); if(p.type==='password'){p.type='text';e.className='fas fa-eye-slash';}else{p.type='password';e.className='fas fa-eye';} }
function getMe(){ let active=localStorage.getItem('activeRole')||''; let t=JSON.parse(localStorage.getItem('myTechV36')||'null'); let c=JSON.parse(localStorage.getItem('myClient')||'null'); if(active==='client'&&c) return c; if(active==='tech'&&t) return t; if(t) return t; if(c) return c; if(localStorage.getItem('adminOK')==='1') return {name:'Admin',email:'admin@housecalls.com',photo:'https://via.placeholder.com/40?text=A',type:'admin'}; return null; }
function getMyId(){ let me=getMe(); return me?me.email:'guest'; }
function toast(m,ty){ let d=document.createElement('div'); d.className='px-4 py-2 rounded-xl text-xs font-bold text-white shadow-lg '+(ty==='err'?'bg-red-600':'bg-green-600'); d.innerText=m; document.getElementById('notif').appendChild(d); setTimeout(()=>d.remove(),4000); }
function getReviews(email){ let all=JSON.parse(localStorage.getItem('reviews_all')||'{}'); return all[email]||[]; }
function getAvg(email){ let revs=getReviews(email); if(revs.length===0) return {avg:0,count:0}; let sum=revs.reduce((a,b)=>a+b.stars,0); return {avg:(sum/revs.length).toFixed(1),count:revs.length}; }
function setStars(n){ curStars=n; for(let i=1;i<=5;i++) document.getElementById('st'+i).innerText=i<=n?'★':'☆'; }
function openReview(email,name){ curRevEmail=email; curStars=0; document.getElementById('revName').innerText=name; let me=getMe(); document.getElementById('revBy').value=me?me.name:'Guest'; document.getElementById('revText').value=''; for(let i=1;i<=5;i++) document.getElementById('st'+i).innerText='☆'; document.getElementById('revModal').classList.remove('hidden'); }
function closeRev(){ document.getElementById('revModal').classList.add('hidden'); } function closePublic(){ document.getElementById('publicModal').classList.add('hidden'); }
function submitReview(){ let by=document.getElementById('revBy').value.trim()||'Guest'; let text=document.getElementById('revText').value.trim(); if(curStars===0){toast('Select stars','err');return;} if(!text){toast('Write review','err');return;} let all=JSON.parse(localStorage.getItem('reviews_all')||'{}'); if(!all[curRevEmail]) all[curRevEmail]=[]; all[curRevEmail].push({by,stars:curStars,text,time:Date.now()}); try{ localStorage.setItem('reviews_all',JSON.stringify(all)); }catch(e){ localStorage.removeItem('chats'); localStorage.setItem('reviews_all',JSON.stringify(all)); } syncToCloud(); closeRev(); toast('Review posted','ok'); }
function renderPublicWall(){ let all=JSON.parse(localStorage.getItem('reviews_all')||'{}'); let wall=document.getElementById('reviewsWall'); if(!wall) return; let html=''; for(let email in all){ all[email].forEach(rv=>{ html+='<div class="bg-pink-50 border p-2 rounded-xl text-[11px]"><b>'+rv.by+'</b> '+('★'.repeat(rv.stars))+'<br>'+rv.text+'</div>'; }); } wall.innerHTML=html||'<span class="text-[11px] text-gray-400">No reviews yet</span>'; }
function timeAgo(ts){ if(!ts) return 'Just now'; let diff=Math.floor((Date.now()-ts)/1000); if(diff<60) return 'Online now'; if(diff<3600) return 'Last seen '+Math.floor(diff/60)+'m ago'; if(diff<86400) return 'Last seen '+Math.floor(diff/3600)+'h ago'; return 'Last seen '+Math.floor(diff/86400)+'d ago'; }
function isOnline(ts){ return ts&&(Date.now()-ts)<300000; }
function enableNotif(){ if(!('Notification' in window)){toast('Not supported','err');return;} Notification.requestPermission().then(p=>{ if(p==='granted'){toast('Notifications enabled','ok');} }); }
function showNotif(title,body){ if(!('Notification' in window)) return; if(Notification.permission!=='granted') return; try{ new Notification(title,{body}); if(navigator.vibrate) navigator.vibrate([300,100,300]); }catch(e){} }
function syncToCloud(){ if(isSyncingFromCloud) return; let data={ allTechs: localStorage.getItem('allTechs')||'[]', reviews: localStorage.getItem('reviews_all')||'{}', lastUpdate: Date.now() }; liveRef.set(data); }
function syncFromCloudLocal(data){ if(!data) return; isSyncingFromCloud=true; if(data.allTechs) try{ localStorage.setItem('allTechs',data.allTechs); }catch(e){} if(data.reviews) try{ localStorage.setItem('reviews_all',data.reviews); }catch(e){} setTimeout(()=>{isSyncingFromCloud=false;},500); }
liveRef.on('value',(snap)=>{ let data=snap.val(); if(!data) return; syncFromCloudLocal(data); renderHome(); renderChat(); renderAdminChat(); loadAdminFixed(); renderPublicWall(); });
usersRef.on('value',(snap)=>{ let data=snap.val(); if(!data) return; let all=Object.values(data); try{ localStorage.setItem('allTechs',JSON.stringify(all)); }catch(e){} renderHome(); renderChat(); renderAdminChat(); loadAdminFixed(); });
function forceReloadUsers(){ usersRef.once('value').then(snap=>{ let data=snap.val(); if(data){ let all=Object.values(data); try{ localStorage.setItem('allTechs',JSON.stringify(all)); }catch(e){} renderHome(); loadAdminFixed(); toast('Reloaded','ok'); } }); }
function clearChatStorage(){ localStorage.removeItem('chats'); allChatsCache=[]; toast('Cleared','ok'); renderChat(); }
chatRef.on('child_added',(snap)=>{ let msg=snap.val(); if(!msg) return; let exists=allChatsCache.some(c=> c.time===msg.time && c.from===msg.from && c.to===msg.to); if(!exists){ allChatsCache.push(msg); try{ let chats=JSON.parse(localStorage.getItem('chats')||'[]'); if(JSON.stringify(chats).length<4000000){ chats.push(msg); localStorage.setItem('chats',JSON.stringify(chats)); } }catch(e){} let myId=getMyId(); if(msg.to===myId && msg.from!==myId){ showNotif('New message from '+msg.user, (msg.text||'').substring(0,60)); } renderChat(); renderAdminChat(); } });
chatRef.on('value',(snap)=>{ let data=snap.val(); if(!data) return; allChatsCache=Object.values(data); renderChat(); renderAdminChat(); });
function updateOnlineStatus(){ let me=getMe(); if(!me) return; me.lastSeen=Date.now(); me.online=true; if(me.type==='tech'){ localStorage.setItem('myTechV36',JSON.stringify(me)); let all=JSON.parse(localStorage.getItem('allTechs')||'[]'); let i=all.findIndex(t=>t.email===me.email); if(i>-1){ all[i].lastSeen=me.lastSeen; all[i].online=true; try{ localStorage.setItem('allTechs',JSON.stringify(all)); }catch(e){} } } if(me.type==='client'){ localStorage.setItem('myClient',JSON.stringify(me)); let all=JSON.parse(localStorage.getItem('allTechs')||'[]'); let i=all.findIndex(t=>t.email===me.email); if(i>-1){ all[i].lastSeen=me.lastSeen; all[i].online=true; try{ localStorage.setItem('allTechs',JSON.stringify(all)); }catch(e){} } } }
function updateRoleBanner(){ let me=getMe(); let b=document.getElementById('roleBanner'); if(!me){ if(b) b.classList.add('hidden'); return; } b.classList.remove('hidden'); if(me.type==='tech'){ b.innerHTML='<b>'+me.name+'</b> • Tech <button onclick="logoutRole()" class="bg-red-600 text-white px-3 py-1 rounded-full text-[10px] ml-2">Logout</button>'; } else if(me.type==='client'){ b.innerHTML='<b>'+me.name+'</b> • Client <button onclick="logoutRole()" class="bg-red-600 text-white px-3 py-1 rounded-full text-[10px] ml-2">Logout</button>'; } else { b.innerHTML='<b>Admin</b> <button onclick="aLogout()" class="bg-red-600 text-white px-3 py-1 rounded-full text-[10px] ml-2">Logout</button>'; } }
function logoutRole(){ let me=getMe(); if(me){ let all=JSON.parse(localStorage.getItem('allTechs')||'[]'); let i=all.findIndex(t=>t.email===me.email); if(i>-1){ all[i].online=false; try{ localStorage.setItem('allTechs',JSON.stringify(all)); }catch(e){} } } localStorage.removeItem('activeRole'); localStorage.removeItem('myTechV36'); localStorage.removeItem('myClient'); localStorage.removeItem('adminOK'); toast('Logged out','ok'); showTab('home'); }
  function renderTechTab(){ let me=getMe(); let active=localStorage.getItem('activeRole'); let div=document.getElementById('techLock'); if(active==='client'&&me&&me.type==='client'){ div.innerHTML='<div class="text-center p-6 bg-red-50 border rounded-xl"><h2 class="font-bold text-red-700">You are logged as Client</h2><p class="text-xs mt-2">Logout to open Tech</p><button onclick="logoutRole()" class="mt-4 bg-red-600 text-white px-6 py-3 rounded-full font-bold">Logout</button></div>'; return; } if(active==='tech'&&me&&me.type==='tech'){ let works=(me.portfolio||[]).map((w,i)=>'<div class="relative"><img src="'+w+'" class="w-full h-28 object-cover rounded-xl border"><button onclick="delWork('+i+')" class="absolute top-1 right-1 bg-red-600 text-white w-6 h-6 rounded-full text-[10px]">X</button></div>').join(''); div.innerHTML='<h2 class="font-bold text-sm">My Profile</h2><div class="bg-gray-50 p-3 rounded-xl mt-3 border"><b class="text-xs">Public Info</b><div class="flex gap-3 mt-2"><div class="text-center"><div class="relative"><img id="pImg" src="'+me.photo+'" class="w-24 h-24 rounded-full object-cover border-2 border-pink-200"><div class="dot-online"></div></div><input type="file" accept="image/*" onchange="toB64(this,\'pImg\',\'pB64\'); setTimeout(updateTechPhoto,500)" class="text-[9px] mt-1 block"></div><div class="flex-1 space-y-2"><input id="nName" value="'+me.name+'" class="w-full p-2 border rounded-xl text-sm"><input id="nExp" value="'+(me.experience||'')+'" class="w-full p-2 border rounded-xl text-sm"><input id="nSalary" value="'+(me.salary||'')+'" class="w-full p-2 border rounded-xl text-sm"><input id="nArea" value="'+me.area+'" class="w-full p-2 border rounded-xl text-sm"><button onclick="updateTechProfile()" class="bg-black text-white px-4 py-2 rounded-full text-xs w-full">Update</button></div></div></div><div class="bg-white p-3 rounded-xl mt-3 border"><b class="text-xs">My Work</b><div class="grid grid-cols-3 gap-2 mt-2">'+(works||'No work yet')+'</div>< function haversine(lat1,lon1,lat2,lon2){ const R=6371; const dLat=(lat2-lat1)*Math.PI/180; const dLon=(lon2-lon1)*Math.PI/180; const a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2); const c=2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)); return R*c; }
async function drawRouteTo(email){ let all=JSON.parse(localStorage.getItem('allTechs')||'[]'); let t=all.find(x=>x.email===email); if(!t){toast('No location','err');return;} targetLat=t.lat; targetLng=t.lng; targetNameG=t.name; if(!myLat){toast('Get My Location first','err');getGPSReal();return;} toast('Drawing route to '+t.name+'...','ok'); if(routeLine) myMap.removeLayer(routeLine); try{ let url=`https://router.project-osrm.org/route/v1/driving/${myLng},${myLat};${t.lng},${t.lat}?overview=full&geometries=geojson`; let res=await fetch(url); let data=await res.json(); if(data.routes&&data.routes.length>0){ let route=data.routes[0]; let coords=route.geometry.coordinates.map(c=>[c[1],c[0]]); let dist=route.distance/1000; let duration=Math.ceil(route.duration/60); routeLine=L.polyline(coords,{color:'#2563eb',weight:5,opacity:0.9}).addTo(myMap); myMap.fitBounds(routeLine.getBounds(),{padding:[30,30]}); document.getElementById('mapInfo').innerHTML='📍 To '+t.name+' • '+dist.toFixed(2)+' km • '+duration+' mins<br><a href="https://www.google.com/maps/dir/?api=1&origin='+myLat+','+myLng+'&destination='+t.lat+','+t.lng+'" target="_blank" class="bg-black text-white px-3 py-1 rounded-full text-[10px] mt-1 inline-block">Open in Google Maps</a>'; document.getElementById('walkInfo').classList.remove('hidden'); document.getElementById('walkInfo').innerHTML='Route: '+dist.toFixed(2)+' km to '+t.name; }else{ throw new Error('No route'); } }catch(e){ let latlngs=[[myLat,myLng],[t.lat,t.lng]]; routeLine=L.polyline(latlngs,{color:'#2563eb',weight:4,opacity:0.7,dashArray:'8,8'}).addTo(myMap); myMap.fitBounds(latlngs,{padding:[30,30]}); let dist=haversine(myLat,myLng,t.lat,t.lng); document.getElementById('mapInfo').innerHTML='Straight distance: '+dist.toFixed(2)+' km'; } }
function getGPSReal(){ if(!navigator.geolocation){toast('GPS not supported','err');return;} toast('Getting location...','ok'); navigator.geolocation.getCurrentPosition(pos=>{ myLat=pos.coords.latitude; myLng=pos.coords.longitude; document.getElementById('mapInfo').innerHTML='You: '+myLat.toFixed(5)+','+myLng.toFixed(5); if(myMap){ myMap.setView([myLat,myLng],15); L.marker([myLat,myLng]).addTo(myMap).bindPopup('You').openPopup(); loadMapMarkers(); } },()=>toast('Allow location','err'),{enableHighAccuracy:true}); }
async function startWalking(){ if(!targetLat){toast('Select a person first','err');return;} if(watchId) navigator.geolocation.clearWatch(watchId); toast('Navigation started','ok'); watchId=navigator.geolocation.watchPosition(async pos=>{ myLat=pos.coords.latitude; myLng=pos.coords.longitude; try{ let url=`https://router.project-osrm.org/route/v1/walking/${myLng},${myLat};${targetLng},${targetLat}?overview=full&geometries=geojson`; let res=await fetch(url); let data=await res.json(); if(data.routes&&data.routes[0]){ let coords=data.routes[0].geometry.coordinates.map(c=>[c[1],c[0]]); let dist=data.routes[0].distance/1000; let time=Math.ceil(data.routes[0].duration/60); if(routeLine) myMap.removeLayer(routeLine); routeLine=L.polyline(coords,{color:'#2563eb',weight:5,opacity:0.9}).addTo(myMap); myMap.setView([myLat,myLng],16); document.getElementById('walkInfo').classList.remove('hidden'); document.getElementById('walkInfo').innerHTML='Remaining: '+dist.toFixed(2)+' km • ~'+time+' mins to '+targetNameG; if(dist<0.05){ showNotif('Arrived','You reached '+targetNameG); toast('Arrived','ok'); navigator.geolocation.clearWatch(watchId); } } }catch(e){ let dist=haversine(myLat,myLng,targetLat,targetLng); document.getElementById('walkInfo').innerHTML='Remaining: '+dist.toFixed(2)+' km'; } },()=>{}, {enableHighAccuracy:true, maximumAge:0}); }
function loadMapMarkers(){ if(!myMap) return; let all=JSON.parse(localStorage.getItem('allTechs')||'[]'); all.forEach(t=>{ if(!t.lat) { t.lat=0.5143+Math.random()*0.04-0.02; t.lng=35.2697+Math.random()*0.04-0.02; } let marker=L.marker([t.lat,t.lng]).addTo(myMap); marker.on('click',()=>{ drawRouteTo(t.email); }); marker.bindPopup('<b>'+t.name+' ['+t.type+']</b><br>'+(t.salary||t.location||'')+'<br><button onclick="drawRouteTo(\''+t.email+'\')" style="background:black;color:white;padding:5px 10px;border-radius:20px;border:none;margin-top:5px">Navigate</button>'); }); }
function focusOn(email){ let all=JSON.parse(localStorage.getItem('allTechs')||'[]'); let t=all.find(x=>x.email===email); if(!t||!myMap) return; myMap.setView([t.lat,t.lng],15); }
function voiceMsg(){ let btn=document.getElementById('vBtn'); if(rec&&rec.state==='recording'){ rec.stop(); btn.innerHTML='<i class="fas fa-microphone text-pink-600"></i>'; return; } let sel=document.getElementById('chatTarget'); let target=sel?sel.value:''; if(!target){toast('Select person','err');return;} if(!navigator.mediaDevices){toast('Mic needs HTTPS','err');return;} navigator.mediaDevices.getUserMedia({audio:true}).then(s=>{ rec=new MediaRecorder(s); let ch=[]; rec.ondataavailable=e=>{ if(e.data.size>0) ch.push(e.data); }; rec.onstop=()=>{ let b=new Blob(ch,{type:'audio/webm'}); let r=new FileReader(); r.onload=e=>{ if(e.target.result.length>500000){ toast('Voice too long','err'); return; } let me=getMe(); let myId=getMyId(); let targetName=sel.options[sel.selectedIndex]?sel.options[sel.selectedIndex].text:target; let msg={user:me.name,from:myId,to:target,toName:targetName,text:'Voice',voice:e.target.result,photo:me.photo,time:Date.now(),private:true}; chatRef.push(msg); }; r.readAsDataURL(b); s.getTracks().forEach(t=>t.stop()); }; rec.start(250); btn.innerHTML='<i class="fas fa-stop text-red-600 animate-pulse"></i>'; setTimeout(()=>{ if(rec&&rec.state==='recording'){ rec.stop(); btn.innerHTML='<i class="fas fa-microphone text-pink-600"></i>'; } },10000); }).catch(err=>{ toast(''+err.message,'err'); btn.innerHTML='<i class="fas fa-microphone text-pink-600"></i>'; }); }
function doAdminLogin(){ if(document.getElementById('aPass').value!==ADMIN){toast('Wrong password','err');return;} localStorage.setItem('adminOK','1'); localStorage.setItem('activeRole','admin'); document.getElementById('aLogin').classList.add('hidden'); document.getElementById('aPanel').classList.remove('hidden'); loadAdminFixed(); renderAdminChat(); }
function checkAdmin(){ if(localStorage.getItem('adminOK')==='1'){ document.getElementById('aLogin').classList.add('hidden'); document.getElementById('aPanel').classList.remove('hidden'); loadAdminFixed(); renderAdminChat(); } }
function aLogout(){ localStorage.removeItem('adminOK'); localStorage.setItem('activeRole','tech'); document.getElementById('aPanel').classList.add('hidden'); document.getElementById('aLogin').classList.remove('hidden'); updateRoleBanner(); }
function renderAdminChat(){ let all=JSON.parse(localStorage.getItem('allTechs')||'[]'); let sel=document.getElementById('adminChatTarget'); let box=document.getElementById('adminChatBox'); if(!sel||!box) return; if(localStorage.getItem('adminOK')!=='1'){ box.innerHTML='<div class="text-center text-gray-400 text-xs">Admin only</div>'; return; } let current=sel.value||''; let options=''; all.forEach(t=>{ let on=isOnline(t.lastSeen||0)?'🟢 ':'⚪ '; options+='<option value="'+t.email+'">'+on+t.name+' ['+t.type+']</option>'; }); sel.innerHTML=options||'<option>No users</option>'; if(current&&[...sel.options].some(o=>o.value===current)){ sel.value=current; } let target=sel.value||''; let filtered=allChatsCache.filter(m=> (m.from==='admin@housecalls.com'&&m.to===target)||(m.from===target&&m.to==='admin@housecalls.com')); if(!target){ box.innerHTML='<div class="text-center text-gray-400 text-xs">Select a person to chat</div>'; return; } if(filtered.length===0){ box.innerHTML='<div class="text-center text-gray-400 text-xs">No messages yet</div>'; return; } box.innerHTML=filtered.map(m=>{ let isMe=m.from==='admin@housecalls.com'; let time=m.time? new Date(m.time).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):''; let bubble=isMe?'msg-me':'msg-other'; let align=isMe?'justify-end':'justify-start'; let voice=m.voice?'<audio controls src="'+m.voice+'" class="w-32 mt-1"></audio>':''; let img=m.image?'<img src="'+m.image+'" class="w-40 rounded-xl mt-1 border">':''; return '<div class="flex '+align+' gap-2 w-full"><div class="max-w-[80%] px-3 py-2 '+bubble+' shadow-sm"><b class="text-[9px] opacity-70 block">'+m.user+' • '+time+'</b><span class="text-[13px]">'+(m.text||'')+'</span>'+voice+img+'</div></div>'; }).join(''); box.scrollTop=box.scrollHeight; }
function sendAdminChat(){ let input=document.getElementById('adminChatInput'); let t=input.value.trim(); if(!t) return; if(t===ADMIN){ toast('Cannot send password','err'); input.value=''; return; } let sel=document.getElementById('adminChatTarget'); let target=sel?sel.value:''; if(!target){toast('Select person','err');return;} let targetName=sel.options[sel.selectedIndex]?sel.options[sel.selectedIndex].text:target; let msg={user:'Admin',from:'admin@housecalls.com',to:target,toName:targetName,text:t,photo:'https://via.placeholder.com/40?text=A',time:Date.now(),private:true}; chatRef.push(msg); input.value=''; }
function loadAdminFixed(){ let all=JSON.parse(localStorage.getItem('allTechs')||'[]'); let pendTech=''; let pendClient=''; let appr=''; all.forEach(t=>{ let r=getAvg(t.email); let on=isOnline(t.lastSeen||0)?'🟢 ':'⚪ '+timeAgo(t.lastSeen||0); if(!t.approved){ if(t.type==='tech'){ pendTech+='<div class="bg-white border p-3 rounded-xl flex gap-3 text-xs"><img src="'+t.photo+'" class="w-14 h-14 rounded-full"><div class="flex-1"><b>'+t.name+'</b> [Tech] - '+on+'<br>Exp: '+(t.experience||'')+'<br>Rate: '+(t.salary||'')+'<br>'+t.email+'<br><div class="flex gap-2 mt-2"><button onclick="approveTech(\''+t.email+'\')" class="bg-black text-white px-4 py-2 rounded-full">Approve</button><button onclick="rejectTech(\''+t.email+'\')" class="bg-gray-100 px-4 py-2 rounded-full">Reject</button></div></div></div>'; } else { pendClient+='<div class="bg-white border p-3 rounded-xl flex gap-3 text-xs"><img src="'+t.photo+'" class="w-12 h-12 rounded-full"><div class="flex-1"><b>'+t.name+'</b> [Client] - '+on+'<br>Service: '+(t.service||'')+' Loc: '+(t.location||'')+'<br>'+t.email+'<br><div class="flex gap-2 mt-2"><button onclick="approveTech(\''+t.email+'\')" class="bg-black text-white px-4 py-2 rounded-full">Approve</button><button onclick="rejectTech(\''+t.email+'\')" class="bg-gray-100 px-4 py-2 rounded-full">Reject</button></div></div></div>'; } } else { appr+='<div class="bg-gray-50 border p-2 rounded-xl text-xs"><b>'+t.name+' ['+t.type+']</b> • ⭐ '+r.avg+' - '+on+'<br>Rate: '+(t.salary||'')+' Location: '+(t.location||t.area||'')+'<br><div class="flex gap-1 mt-1"><button onclick="openPublicProfile(\''+t.email+'\')" class="bg-black text-white px-2 py-1 rounded-full text-[9px]">View</button><button onclick="rejectTech(\''+t.email+'\')" class="bg-gray-100 px-2 py-1 rounded-full text-[9px]">Remove</button></div></div>'; } }); document.getElementById('aPendTech').innerHTML=pendTech||'No pending technicians'; document.getElementById('aPendClient').innerHTML=pendClient||'No pending clients'; document.getElementById('aAppr').innerHTML=appr||'No approved yet'; let allRev=JSON.parse(localStorage.getItem('reviews_all')||'{}'); let rh=''; for(let email in allRev){ allRev[email].forEach(rv=>{ rh+='<div class="bg-gray-50 border p-2 rounded-xl text-xs"><b>'+rv.by+'</b> → '+email+' '+('★'.repeat(rv.stars))+'<br>'+rv.text+'</div>'; }); } document.getElementById('aReviews').innerHTML=rh||'No reviews'; }
function approveTech(email){ let all=JSON.parse(localStorage.getItem('allTechs')||'[]'); let i=all.findIndex(t=>t.email===email); if(i>-1){ all[i].approved=true; all[i].status='available'; try{ localStorage.setItem('allTechs',JSON.stringify(all)); }catch(e){} usersRef.child(btoa(email).replace(/[^a-zA-Z0-9]/g,'')).update({approved:true,status:'available'}); liveRef.set({allTechs:JSON.stringify(all),reviews:localStorage.getItem('reviews_all')||'{}'}); } toast('Approved','ok'); loadAdminFixed(); renderHome(); }
function rejectTech(email){ if(!confirm('Delete '+email+'?')) return; let all=JSON.parse(localStorage.getItem('allTechs')||'[]'); all=all.filter(t=>t.email!==email); try{ localStorage.setItem('allTechs',JSON.stringify(all)); }catch(e){} usersRef.child(btoa(email).replace(/[^a-zA-Z0-9]/g,'')).remove(); liveRef.set({allTechs:JSON.stringify(all),reviews:localStorage.getItem('reviews_all')||'{}'}); toast('Removed','ok'); loadAdminFixed(); renderHome(); }
function syncFromCloud(){ usersRef.once('value').then(snap=>{ let data=snap.val(); if(data){ let all=Object.values(data); try{ localStorage.setItem('allTechs',JSON.stringify(all)); }catch(e){} renderHome(); loadAdminFixed(); toast('Synced','ok'); } }); }
setInterval(()=>{ updateOnlineStatus(); },10000); updateOnlineStatus(); renderHome(); renderChat(); renderTechTab(); renderClientTab(); renderPublicWall(); renderAdminChat();
